spring.application.name=scheduler-api

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/scheduler_db
spring.datasource.username=scheduler_user
spring.datasource.password=scheduler_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Timezone normalization: store everything in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Google Calendar Integration
google.calendar.credentials.path=google-credentials.json
google.calendar.id=estvmc@gmail.com

