<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Booky — Agendamento Simples & Fluido</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F1EC;
    --panel:#FFFFFF;
    --ink:#1F2320;
    --ink-soft:#6B7168;
    --line:#E7E2D8;
    --accent:#B55A2E;
    --accent-soft:#F1E3D6;
    --rail:#20261F;
    --rail-ink:#EFEBE2;
    --shadow: 0 20px 40px -24px rgba(31,35,32,0.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15170F;
      --panel:#1D2018;
      --ink:#EDEAE1;
      --ink-soft:#9A9C8F;
      --line:#2B2E23;
      --accent:#E08A4F;
      --accent-soft:#3A2A1E;
      --rail:#0E100B;
      --rail-ink:#EDEAE1;
      --shadow: 0 20px 40px -24px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15170F; --panel:#1D2018; --ink:#EDEAE1; --ink-soft:#9A9C8F;
    --line:#2B2E23; --accent:#E08A4F; --accent-soft:#3A2A1E; --rail:#0E100B; --rail-ink:#EDEAE1;
    --shadow: 0 20px 40px -24px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; padding:48px 20px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
  }
  .logo{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:'Fraunces',serif; font-weight:600; font-size:26px;
    margin-bottom:32px; letter-spacing:-0.02em;
  }
  .logo .dot{color:var(--accent);}
  .logo svg{flex-shrink:0;}
  .board{
    max-width:920px; width:100%; margin:0 auto;
    display:grid; grid-template-columns:240px 1fr 250px;
    border-radius:24px; overflow:hidden; box-shadow:var(--shadow);
    background:var(--panel);
  }
  .rail{
    background:var(--rail); color:var(--rail-ink); padding:32px 24px;
    display:flex; flex-direction:column;
  }
  .avatar{
    width:48px; height:48px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:18px; color:#1F2320;
    margin-bottom:16px;
  }
  .rail h2{font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:0 0 4px;}
  .rail .role{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#B8B8A9; margin-bottom:28px;}
  .rail .label{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#8C8E7F; margin-bottom:6px;}
  .rail a{color:var(--accent); font-size:13px; text-decoration:none; word-break:break-all;}
  .rail .meta{margin-top:auto; padding-top:24px; border-top:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; gap:12px; font-size:13px; color:#C7C8BB;}
  .meta span{display:flex; align-items:center; gap:8px;}

  .calendar{ background:var(--panel); padding:32px 28px; }
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .cal-head h3{font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:0;}
  .cal-head button{
    border:1px solid var(--line); background:none; width:30px; height:30px; 
    border-radius:8px; color:var(--ink-soft); cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .cal-head button:hover{ border-color:var(--accent); color:var(--accent); }
  .weekdays, .days{display:grid; grid-template-columns:repeat(7,1fr); text-align:center;}
  .weekdays div{font-size:11px; color:var(--ink-soft); padding-bottom:12px; font-weight:600;}
  
  .days div{
    height:36px; display:flex; align-items:center; justify-content:center;
    font-size:13px; border-radius:10px; color:var(--ink-soft); position:relative;
    user-select:none; margin:2px 0;
  }
  .days div.empty{ cursor:default; }
  .days div.disabled{ color:var(--line); cursor:not-allowed; }
  .days div.available{ color:var(--ink); font-weight:500; cursor:pointer; }
  .days div.available:hover{ background:var(--accent-soft); color:var(--accent); }
  .days div.today{ border:1px solid var(--line); font-weight:600; }
  .days div.picked{ background:var(--accent) !important; color:#fff !important; font-weight:600; }

  .slots{ 
    background:var(--panel); padding:32px 24px; border-left:1px solid var(--line); 
    display:flex; flex-direction:column; max-height:540px; overflow-y:auto;
  }
  .slots h4{font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin:0 0 16px;}
  .grid-slots{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .slot{
    border:1px solid var(--line); border-radius:10px; padding:10px 0; text-align:center;
    font-size:12.5px; color:var(--ink); cursor:pointer; transition:.15s; font-weight:500;
  }
  .slot:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .slot.picked{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}
  
  .hint{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}

  /* Modal de Agendamento */
  .modal-overlay{
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(21, 23, 15, 0.6); backdrop-filter:blur(3px);
    align-items:center; justify-content:center; z-index:100;
  }
  .modal-box{
    background:var(--panel); color:var(--ink); padding:32px; border-radius:20px;
    width:100%; max-width:420px; box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .modal-box h3{font-family:'Fraunces',serif; font-size:18px; margin:0 0 6px;}
  .modal-box p{font-size:13px; color:var(--ink-soft); margin:0 0 20px;}
  .form-group{margin-bottom:16px;}
  .form-group label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
  .form-group input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; background:var(--bg); color:var(--ink); outline:none; font-family:'Inter',sans-serif;
  }
  .form-group input:focus{border-color:var(--accent);}
  .modal-actions{display:flex; gap:10px; margin-top:24px;}
  .btn-submit{
    flex:1; padding:12px; background:var(--accent); color:#fff; border:none;
    border-radius:10px; font-weight:600; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-submit:hover{opacity:.9;}
  .btn-cancel{
    padding:12px 18px; background:var(--line); color:var(--ink); border:none;
    border-radius:10px; font-weight:600; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
  }

  @media (max-width:768px){
    .board{grid-template-columns:1fr;}
    .slots{border-left:none; border-top:1px solid var(--line);}
  }
</style>
</head>
<body>

  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    Booky<span class="dot">.</span>
  </div>

  <div class="board">
    <!-- Coluna 1: Rail do Profissional -->
    <div class="rail">
      <div class="avatar">E</div>
      <h2>Estevam Silva</h2>
      <div class="role">Atendimento Privado</div>

      <div class="label">Link da reunião / Endereço</div>
      <a href="https://us05web.zoom.us/j/8927448044" target="_blank">us05web.zoom.us/j/8927448044</a>

      <div class="meta">
        <span>⏱ 20 minutos</span>
        <span>🎥 Zoom Meeting</span>
        <span>🌐 (GMT-3) Brasília</span>
      </div>
    </div>

    <!-- Coluna 2: Calendário Dinâmico -->
    <div class="calendar">
      <div class="cal-head">
        <button id="prevMonthBtn">←</button>
        <h3 id="calMonthYear"></h3>
        <button id="nextMonthBtn">→</button>
      </div>
      <div class="weekdays"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
      <div class="days" id="daysGrid"></div>
    </div>

    <!-- Coluna 3: Horários Disponíveis via API -->
    <div class="slots" id="slotsPanel">
      <h4 id="slotsDate">Selecione uma data</h4>
      <div class="grid-slots" id="slotsGrid">
        <div class="hint" style="grid-column: span 2;">Escolha um dia para consultar horários.</div>
      </div>
    </div>
  </div>

  <!-- Modal de Confirmação conectado ao Backend -->
  <div class="modal-overlay" id="bookingModal">
    <div class="modal-box">
      <h3>Confirmar Agendamento</h3>
      <p id="modalSlotDetails"></p>
      
      <form id="confirmForm">
        <div class="form-group">
          <label>Seu Nome Completo</label>
          <input type="text" id="studentNameInput" placeholder="Ex: Maria Silva" required>
        </div>
        <div class="form-group">
          <label>Seu E-mail</label>
          <input type="email" id="studentEmailInput" placeholder="maria@exemplo.com" required>
        </div>
        <!-- Novo campo: WhatsApp -->
        <div class="form-group">
          <label>Seu WhatsApp (com DDD)</label>
          <input type="tel" id="studentPhoneInput" placeholder="+5515999999999" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelModalBtn">Voltar</button>
          <button type="submit" class="btn-submit" id="confirmModalBtn">Agendar Agora</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let selectedDate = null;
    let selectedSlotIso = null;

    const calMonthYear = document.getElementById('calMonthYear');
    const daysGrid = document.getElementById('daysGrid');
    const prevMonthBtn = document.getElementById('prevMonthBtn');
    const nextMonthBtn = document.getElementById('nextMonthBtn');
    const slotsDate = document.getElementById('slotsDate');
    const slotsGrid = document.getElementById('slotsGrid');
    const bookingModal = document.getElementById('bookingModal');
    const modalSlotDetails = document.getElementById('modalSlotDetails');
    const confirmForm = document.getElementById('confirmForm');
    const cancelModalBtn = document.getElementById('cancelModalBtn');

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
                          "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
      calMonthYear.textContent = `${monthNames[month]} de ${year}`;

      daysGrid.innerHTML = "";

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        daysGrid.appendChild(empty);
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.textContent = day;

        const cellDate = new Date(year, month, day);
        const dayOfWeek = cellDate.getDay();

        if (cellDate.getTime() === today.getTime()) {
          cell.classList.add('today');
        }

        // Desabilita fins de semana e dias passados
        if (cellDate < today || dayOfWeek === 0 || dayOfWeek === 6) {
          cell.classList.add('disabled');
        } else {
          cell.classList.add('available');

          if (selectedDate && 
              selectedDate.getFullYear() === year && 
              selectedDate.getMonth() === month && 
              selectedDate.getDate() === day) {
            cell.classList.add('picked');
          }

          cell.addEventListener('click', () => {
            document.querySelectorAll('.days div').forEach(d => d.classList.remove('picked'));
            cell.classList.add('picked');
            selectedDate = cellDate;
            loadSlotsForDate(cellDate);
          });
        }

        daysGrid.appendChild(cell);
      }
    }

    async function loadSlotsForDate(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}-${mm}-${dd}`;

      const label = date.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
      slotsDate.textContent = label;
      slotsGrid.innerHTML = '<div class="hint" style="grid-column:span 2;">Carregando horários...</div>';

      try {
        const res = await fetch(`/api/bookings/availability?date=${dateStr}`);
        const data = await res.json();

        slotsGrid.innerHTML = "";

        if (!data.availableSlots || data.availableSlots.length === 0) {
          slotsGrid.innerHTML = '<div class="hint" style="grid-column:span 2; color:#dc2626;">Sem horários livres para esta data.</div>';
          return;
        }

        data.availableSlots.forEach(slotIso => {
          const slotDate = new Date(slotIso);
          const timeStr = slotDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          const div = document.createElement('div');
          div.className = 'slot';
          div.textContent = timeStr;

          div.addEventListener('click', () => {
            selectedSlotIso = slotIso;
            modalSlotDetails.textContent = `${label} às ${timeStr} (Sessão de 20 minutos)`;
            bookingModal.style.display = 'flex';
          });

          slotsGrid.appendChild(div);
        });
      } catch (err) {
        slotsGrid.innerHTML = '<div class="hint" style="grid-column:span 2; color:#dc2626;">Erro ao consultar horários.</div>';
      }
    }

    prevMonthBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    cancelModalBtn.addEventListener('click', () => {
      bookingModal.style.display = 'none';
    });

    confirmForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const confirmBtn = document.getElementById('confirmModalBtn');
      confirmBtn.disabled = true;
      confirmBtn.textContent = "Agendando...";

      const name = document.getElementById('studentNameInput').value.trim();
      const email = document.getElementById('studentEmailInput').value.trim();
      const phone = document.getElementById('studentPhoneInput').value.trim();

      try {
        const response = await fetch('/api/bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            studentName: name,
            studentEmail: email,
            studentPhone: phone,
            startTime: selectedSlotIso
          })
        });

        if (response.status === 201) {
          bookingModal.style.display = 'none';
          confirmForm.reset();
          
          const time = new Date(selectedSlotIso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
          const dateLabel = slotsDate.textContent;
          
          slotsGrid.innerHTML = `
            <div style="grid-column:span 2; text-align:center; padding:24px 0;">
              <div style="width:44px; height:44px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-size:20px;">✓</div>
              <h5 style="font-family:'Fraunces',serif; font-size:15px; margin:0 0 6px;">Agendado com Sucesso!</h5>
              <p style="font-size:12.5px; color:var(--ink-soft); margin:0;">${dateLabel} às ${time}</p>
            </div>`;

          setTimeout(() => { loadSlotsForDate(selectedDate); }, 3500);
        } else {
          const errData = await response.json();
          alert("Erro: " + (errData.message || "Não foi possível agendar"));
        }
      } catch (err) {
        alert("Erro de comunicação com o servidor.");
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.textContent = "Agendar Agora";
      }
    });

    renderCalendar();
  </script>
</body>
</html>
