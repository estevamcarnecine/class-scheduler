version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: scheduler-postgres
    restart: always
    environment:
      POSTGRES_DB: scheduler_db
      POSTGRES_USER: scheduler_user
      POSTGRES_PASSWORD: scheduler_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: